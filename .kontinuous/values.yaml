app:
  containerPort: 8080
  securityContext:
    fsGroup: 101
    runAsGroup: 101
    runAsUser: 101
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Static "service suspendu" notice: one replica is enough. The PDB that ships
  # with autoscale would also block node drains once down to a single replica.
  replicas: 1
  autoscale:
    enabled: false
